<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" style="background:#090d16; border-radius: 16px; font-family: 'Inter', system-ui, sans-serif;">
  <defs>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #eab308); }
    }
    @keyframes scanner {
      0% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(200px); opacity: 0.8; }
      100% { transform: translateY(0); opacity: 0.3; }
    }
    @keyframes flow-line {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .text-title {
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .text-accent {
      fill: #eab308;
      font-weight: 900;
    }
    .laser-line {
      stroke: #eab308;
      stroke-width: 2;
      opacity: 0.7;
      animation: scanner 4s infinite ease-in-out;
    }
    .slot-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    .flow-path {
      stroke: #38bdf8;
      stroke-width: 1.5;
      stroke-dasharray: 8 8;
      animation: flow-line 2s infinite linear;
      opacity: 0.4;
    }
  </style>

  <!-- Flowing background connection lines -->
  <path d="M 50,50 L 750,50" class="flow-path" />
  <path d="M 50,150 L 750,150" class="flow-path" />
  
  <!-- Grid layout drawing -->
  <line x1="50" y1="0" x2="50" y2="200" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="750" y1="0" x2="750" y2="200" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Scanning laser line -->
  <line x1="50" y1="0" x2="750" y2="0" class="laser-line" />

  <!-- Parking slot indicators -->
  <g transform="translate(100, 100)">
    <!-- Available -->
    <circle cx="0" cy="0" r="6" fill="#22c55e" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  </g>
  <g transform="translate(140, 100)">
    <!-- Maintenance -->
    <circle cx="0" cy="0" r="6" fill="#eab308" class="slot-dot" style="animation-delay: 0.5s;" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.5"/>
  </g>
  <g transform="translate(180, 100)">
    <!-- Occupied/Verified -->
    <circle cx="0" cy="0" r="6" fill="#ef4444" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
  </g>
  <g transform="translate(220, 100)">
    <!-- Unverified Flowing -->
    <circle cx="0" cy="0" r="6" fill="#eab308" class="slot-dot" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Title Text -->
  <text x="290" y="112" class="text-title" filter="url(#glow)">SMART<tspan class="text-accent">PARK</tspan></text>
  <text x="290" y="132" fill="#64748b" font-size="10" font-weight="700" letter-spacing="2" text-transform="uppercase">Cloud Parking Command Center</text>

  <!-- Decorative camera aperture icon -->
  <g transform="translate(680, 100)" stroke="#eab308" stroke-width="2" fill="none" opacity="0.8">
    <circle cx="0" cy="0" r="22" stroke="#1e293b" stroke-width="4"/>
    <circle cx="0" cy="0" r="18" />
    <line x1="-12" y1="-12" x2="12" y2="-12" />
    <line x1="12" y1="-12" x2="12" y2="12" />
    <line x1="12" y1="12" x2="-12" y2="12" />
    <line x1="-12" y1="12" x2="-12" y2="-12" />
    <!-- Scanning eye iris -->
    <circle cx="0" cy="0" r="6" fill="#eab308" class="slot-dot" style="animation-delay: 1s;" />
  </g>
</svg>
